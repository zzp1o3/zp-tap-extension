<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页</title>
  <link rel="stylesheet" href="src/newtab/tailwind.css" />
  <!-- 早期聚焦：普通同步脚本，抢在 Chrome 抢占地址栏焦点之前 -->
  <script src="src/newtab/focus-init.js"></script>
</head>
<body data-state="idle">
  <div id="wallpaper"></div>
  <video id="video-bg" class="hidden fixed inset-0 w-full h-full object-cover z-0 pointer-events-none" muted loop playsinline autoplay preload="auto"></video>
  <div id="wallpaper-shade"></div>

  <!-- 搜索框：任何模式下始终在 DOM 且可聚焦（IME 组合第一键就落在 input 上，不吞字）。
       隐藏模式用 search-invisible 类让它透明不可见但可接收键盘；常驻用 search-faded -->
  <!-- style="opacity:0" 兜底：CSS 加载完成前输入框也不可见（防首帧闪烁） -->
  <div id="search-box" style="opacity:0" class="tap-drop-in search-invisible fixed top-[18vh] left-1/2 -translate-x-1/2 flex items-center gap-2 w-[min(640px,88vw)] h-14 px-3 py-0 rounded-3xl border border-[var(--tp-line2)] bg-[var(--tp-glass)] backdrop-blur-md text-[var(--tp-tx)] shadow-[0_10px_40px_rgba(0,0,0,0.35)] z-10">
    <div id="engine-switch" class="relative">
      <button id="engine-name" type="button" title="切换搜索引擎"
              class="flex items-center gap-1.5 px-2.5 py-1.5 text-[15px] text-[var(--tp-tx-3)] rounded-2xl transition-all duration-300 ease-in-out hover:scale-105 hover:bg-[var(--tp-hover)]">
      </button>
      <div id="engine-list" class="tap-fade-in hidden absolute top-[calc(100%+6px)] left-0 min-w-[140px] p-1.5 rounded-2xl border border-[var(--tp-line)] bg-[var(--tp-glass)] backdrop-blur-md text-[var(--tp-tx)] shadow-[0_10px_30px_rgba(0,0,0,0.4)] z-20">
      </div>
    </div>
    <input id="q" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" aria-label="搜索"
           class="flex-1 min-w-0 bg-transparent outline-none border-0 text-[var(--tp-tx)] text-[17px] px-1 py-2 placeholder:text-[var(--tp-tx-dim)]" />
  </div>

  <!-- 建议面板 -->
  <div id="suggestions" class="tap-fade-in hidden fixed top-[calc(18vh+60px)] left-1/2 -translate-x-1/2 w-[min(640px,88vw)] max-h-[60vh] overflow-y-auto p-1.5 rounded-2xl border border-[var(--tp-line)] bg-[var(--tp-glass)] backdrop-blur-md shadow-[0_12px_36px_rgba(0,0,0,0.4)] z-9"></div>

  <!-- 设置齿轮：可隐藏，隐藏时贴边留小箭头，悬停滑出齿轮 -->
  <div id="gear-wrap" class="fixed top-4 right-0 z-30">
    <!-- 贴边触发箭头（始终可见，齿轮常驻时也不影响） -->
    <div id="gear-tab" class="w-1.5 h-16 rounded-l-md cursor-pointer bg-[var(--tp-gear)] transition-all duration-300 ease-in-out" title="设置"></div>
    <!-- 齿轮本体：藏起时 translate-x 移出屏幕，absolute 不占文档流 -->
    <button id="gear" type="button" title="设置" aria-label="设置"
            class="absolute top-3 right-1 w-10 h-10 rounded-full flex items-center justify-center text-[var(--tp-tx)] bg-[var(--tp-gear)] opacity-35 transition-all duration-300 ease-in-out hover:scale-105 hover:bg-[var(--tp-hover)] hover:text-[var(--tp-tx)] hover:opacity-100">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <!-- 设置抽屉 -->
  <div id="settings-drawer" class="fixed inset-0 z-40 pointer-events-none">
    <div id="settings-overlay" class="absolute inset-0 bg-[var(--tp-overlay)] opacity-0 transition-opacity duration-300 ease-in-out"></div>
    <div id="settings-panel" class="absolute top-0 right-0 h-full w-[min(440px,100vw)] bg-[var(--tp-drawer)] backdrop-blur-xl border-l border-[var(--tp-line)] translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <header class="flex items-center justify-between px-5 py-4 border-b border-[var(--tp-line)] shrink-0">
        <h1 class="text-[18px] font-medium text-[var(--tp-tx)]">设置</h1>
        <button id="settings-close" type="button" title="关闭"
                class="w-9 h-9 rounded-lg flex items-center justify-center text-[var(--tp-tx-2)] transition-all duration-300 ease-in-out hover:scale-105 hover:bg-[var(--tp-hover)] hover:text-[var(--tp-tx)]">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <iframe id="settings-frame" class="flex-1 border-0 w-full bg-transparent" title="设置"></iframe>
    </div>
  </div>

  <script type="module" src="src/newtab/main.js"></script>
</body>
</html>
