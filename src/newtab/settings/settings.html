<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置</title>
  <link rel="stylesheet" href="../tailwind.css" />
</head>
<body class="bg-[#0f1013] text-white">
  <div class="max-w-[720px] mx-auto px-6 pt-8 pb-16">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-[22px] font-medium">设置</h1>
      <button id="close" type="button" title="关闭"
              class="w-9 h-9 rounded-lg flex items-center justify-center text-white/70 transition-all duration-300 ease-in-out hover:scale-105 hover:bg-white/10 hover:text-white">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>

    <section class="bg-white/[0.04] border border-white/10 rounded-2xl p-5 mb-5">
      <h2 class="text-base mb-2">搜索引擎</h2>
      <p class="text-[13px] text-white/55 mb-3">拖拽排序；快捷组 = 排序后的前 <input id="shortcut-count" type="number" min="1" max="9" class="w-16 px-2 py-1 rounded-lg bg-[#14161b] border border-white/10 text-white text-[13px]" /> 个（用于 Ctrl+↑/↓ 切换）</p>
      <ul id="engine-list" class="list-none p-0 m-0 mb-3 space-y-1.5"></ul>
      <div class="flex gap-2 items-center flex-wrap">
        <input id="new-name" type="text" placeholder="名称" class="px-3 py-2 rounded-lg bg-[#14161b] border border-white/10 text-white text-[14px]" />
        <input id="new-url" type="text" placeholder="URL 模板（含 {q}，如 https://example.com/s?q={q}）" class="flex-1 min-w-[220px] px-3 py-2 rounded-lg bg-[#14161b] border border-white/10 text-white text-[14px]" />
        <button id="add-engine" type="button"
                class="px-4 py-2 rounded-lg bg-white/15 text-white text-[14px] transition-all duration-300 ease-in-out hover:scale-105 hover:bg-white/20">添加</button>
      </div>
    </section>

    <section class="bg-white/[0.04] border border-white/10 rounded-2xl p-5 mb-5">
      <h2 class="text-base mb-2">壁纸</h2>
      <p class="text-[13px] text-white/55 mb-3">上传本地图片，自动压缩后存于本机；无外网依赖。</p>
      <div class="flex gap-2 items-center mb-3">
        <input id="wp-file" type="file" accept="image/*" multiple class="text-[13px] text-white/70 file:mr-3 file:px-3 file:py-1.5 file:rounded-lg file:border-0 file:bg-white/10 file:text-white file:cursor-pointer" />
      </div>
      <div id="wp-grid" class="grid gap-2.5 mb-4" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))"></div>
      <div class="flex gap-3 items-center flex-wrap text-[14px]">
        <label class="flex items-center gap-2">
          <span class="text-white/70">轮播模式：</span>
          <select id="wp-mode" class="px-2 py-1.5 rounded-lg bg-[#14161b] border border-white/10 text-white text-[14px]">
            <option value="per-open">每次打开新标签页换一张</option>
            <option value="interval">同标签页内定时切换</option>
          </select>
        </label>
        <label class="interval hidden flex items-center gap-2">
          <span class="text-white/70">间隔（秒）：</span>
          <input id="wp-interval" type="number" min="5" step="1" value="30" class="w-20 px-2 py-1.5 rounded-lg bg-[#14161b] border border-white/10 text-white text-[14px]" />
        </label>
      </div>
    </section>

    <footer class="text-right">
      <button id="done" type="button"
              class="min-w-[120px] px-5 py-2.5 rounded-xl bg-white/15 text-white transition-all duration-300 ease-in-out hover:scale-105 hover:bg-white/20">完成</button>
    </footer>
  </div>
  <script type="module" src="settings.js"></script>
</body>
</html>
