<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置</title>
  <link rel="stylesheet" href="../tailwind.css" />
</head>
<body class="h-full bg-transparent overflow-y-auto" style="color:var(--tp-tx)">
  <div class="px-5 py-4 space-y-4">
    <!-- 主题 -->
    <section class="bg-[var(--tp-card)] border border-[var(--tp-line)] rounded-2xl p-4">
      <h2 class="text-[15px] mb-2 flex items-center gap-2" style="color:var(--tp-tx)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-80" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        主题
      </h2>
      <div class="flex gap-2 flex-wrap">
        <button class="theme-btn px-4 py-2 rounded-xl border text-[13px] transition-all duration-300 ease-in-out hover:scale-105" data-theme="system" style="border-color:var(--tp-line);color:var(--tp-tx-2)">随系统</button>
        <button class="theme-btn px-4 py-2 rounded-xl border text-[13px] transition-all duration-300 ease-in-out hover:scale-105" data-theme="dark" style="border-color:var(--tp-line);color:var(--tp-tx-2)">深色</button>
        <button class="theme-btn px-4 py-2 rounded-xl border text-[13px] transition-all duration-300 ease-in-out hover:scale-105" data-theme="light" style="border-color:var(--tp-line);color:var(--tp-tx-2)">浅色</button>
      </div>
    </section>

    <!-- 搜索引擎 -->
    <section class="bg-[var(--tp-card)] border border-[var(--tp-line)] rounded-2xl p-4">
      <h2 class="text-[15px] mb-2 flex items-center gap-2" style="color:var(--tp-tx)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-80" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        搜索引擎
      </h2>
      <p class="text-[12px] mb-3 leading-relaxed" style="color:var(--tp-tx-dim)">拖拽排序；快捷组 = 排序后的前 <input id="shortcut-count" type="number" min="1" max="9" class="w-14 px-2 py-0.5 rounded-md border text-[12px]" style="background:var(--tp-input);border-color:var(--tp-line);color:var(--tp-tx)" /> 个（用于 Ctrl+↑/↓ 切换）</p>
      <ul id="engine-list" class="list-none p-0 m-0 mb-3 space-y-1.5"></ul>
      <div class="flex gap-2 items-center flex-wrap">
        <input id="new-name" type="text" placeholder="名称" class="px-3 py-2 rounded-lg border text-[13px]" style="background:var(--tp-input);border-color:var(--tp-line);color:var(--tp-tx)" />
        <input id="new-url" type="text" placeholder="URL 模板（含 {q}）" class="flex-1 min-w-[160px] px-3 py-2 rounded-lg border text-[13px]" style="background:var(--tp-input);border-color:var(--tp-line);color:var(--tp-tx)" />
        <button id="add-engine" type="button"
                class="px-3 py-2 rounded-lg text-[13px] transition-all duration-300 ease-in-out hover:scale-105 flex items-center gap-1" style="background:var(--tp-glass2);color:var(--tp-tx)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          添加
        </button>
      </div>
    </section>

    <!-- 背景媒体 -->
    <section class="bg-[var(--tp-card)] border border-[var(--tp-line)] rounded-2xl p-4">
      <h2 class="text-[15px] mb-2 flex items-center gap-2" style="color:var(--tp-tx)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-80" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L6 21"/></svg>
        背景媒体
      </h2>
      <p class="text-[12px] mb-3 leading-relaxed" style="color:var(--tp-tx-dim)">上传本地图片/视频，或填入远程 URL。支持同序列轮播。</p>
      <div class="flex gap-2 mb-3 flex-wrap">
        <label class="flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl border border-dashed cursor-pointer text-[13px] transition-all duration-300 ease-in-out hover:scale-[1.02] shrink-0" style="background:var(--tp-upload);border-color:var(--tp-line3);color:var(--tp-tx-2)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          图片
          <input id="wp-file" type="file" accept="image/*" multiple class="hidden" />
        </label>
        <label class="flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl border border-dashed cursor-pointer text-[13px] transition-all duration-300 ease-in-out hover:scale-[1.02] shrink-0" style="background:var(--tp-upload);border-color:var(--tp-line3);color:var(--tp-tx-2)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          视频
          <input id="video-file" type="file" accept="video/*" class="hidden" />
        </label>
        <div class="flex items-center gap-1.5 flex-1 min-w-[220px]">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0" style="color:var(--tp-tx-dim)" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <input id="media-url" type="text" placeholder="图片或视频 URL（含协议）"
                 class="flex-1 min-w-0 px-3 py-2 rounded-lg border text-[13px]" style="background:var(--tp-input);border-color:var(--tp-line);color:var(--tp-tx)" />
          <button id="add-url" type="button"
                  class="px-3 py-2 rounded-lg text-[13px] transition-all duration-300 ease-in-out hover:scale-105 shrink-0" style="background:var(--tp-glass2);color:var(--tp-tx)">添加</button>
        </div>
      </div>
      <div id="wp-grid" class="grid gap-2 mb-4" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))"></div>
      <div class="flex gap-3 items-center flex-wrap text-[13px]">
        <label class="flex items-center gap-2">
          <span style="color:var(--tp-tx-2)">轮播模式：</span>
          <select id="wp-mode" class="px-2 py-1.5 rounded-lg border text-[13px]" style="background:var(--tp-input);border-color:var(--tp-line);color:var(--tp-tx)">
            <option value="per-open">每次打开换一张</option>
            <option value="interval">同标签页内定时</option>
          </select>
        </label>
        <label class="interval hidden flex items-center gap-2">
          <span style="color:var(--tp-tx-2)">间隔（秒）：</span>
          <input id="wp-interval" type="number" min="5" step="1" value="30" class="w-16 px-2 py-1.5 rounded-lg border text-[13px]" style="background:var(--tp-input);border-color:var(--tp-line);color:var(--tp-tx)" />
        </label>
      </div>
    </section>
  </div>
  <script type="module" src="settings.js"></script>
</body>
</html>
